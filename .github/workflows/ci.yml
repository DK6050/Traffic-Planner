name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: traffic-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: traffic-backend/package-lock.json
      - run: npm ci
      - run: node --check index.js
